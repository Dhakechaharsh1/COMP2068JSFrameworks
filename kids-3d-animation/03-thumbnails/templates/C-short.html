<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Thumbnail C — Short</title>
<style>
  /* Layout C — "pop punch"  ·  1080 x 1920 vertical
     ?mode=guide    UI-safe zones + placeholder backdrop
     ?mode=overlay  transparent, typography only
     &bg=<path>     use your own image as the background                        */

  html, body { margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    font-family: "Fredoka", "Baloo 2", "Nunito", "DejaVu Sans", sans-serif;
  }

  #bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  body.guide #bg { background: #8BE23A; }   /* lime — the cover-frame backdrop */

  /* --- typography -------------------------------------------------------- */
  .title {
    position: absolute; left: 0; right: 0; top: 196px; text-align: center;
    font-size: 180px; font-weight: 800; letter-spacing: 2px; color: #FFFFFF;
    -webkit-text-stroke: 14px #12233A; paint-order: stroke fill;
    text-shadow: 0 8px 16px rgba(0,0,0,.5);
    transform: rotate(-6deg);
  }

  /* --- guide chrome ------------------------------------------------------ */
  .g { display: none; }
  body.guide .g { display: block; }

  .band    { position: absolute; left: 0; right: 0; }
  .top     { top: 0; height: 288px;  background: repeating-linear-gradient(45deg, rgba(0,0,0,.13) 0 14px, transparent 14px 28px);
             border-bottom: 3px solid rgba(0,0,0,.45); }
  .bottom  { bottom: 0; height: 480px; background: rgba(0,0,0,.42);
             border-top: 3px solid rgba(255,60,60,.9); }
  .safe    { position: absolute; left: 0; right: 0; top: 288px; height: 1152px;
             border-top: 2px dashed rgba(255,255,255,.7);
             border-bottom: 2px dashed rgba(255,255,255,.7); }
  .subject { position: absolute; left: 50%; top: 780px; transform: translate(-50%,-50%);
             width: 700px; height: 700px; border-radius: 30px;
             border: 4px dashed rgba(255,255,255,.65);
             display: flex; align-items: center; justify-content: center;
             font: 600 32px/1.6 "DejaVu Sans", sans-serif; color: rgba(255,255,255,.9);
             text-align: center; padding: 0 20px; }
  .arc     { position: absolute; left: 560px; top: 700px; width: 460px; height: 320px;
             border: 5px dotted rgba(255,255,255,.6); border-radius: 50%;
             border-left-color: transparent; border-bottom-color: transparent; }
  .lbl     { position: absolute; font: 600 26px/1.35 "DejaVu Sans", sans-serif; color: #fff;
             background: rgba(0,0,0,.66); padding: 8px 13px; border-radius: 6px; }
</style>
</head>
<body>
  <div id="bg"></div>

  <div class="g band top"></div>
  <div class="g lbl" style="left:24px; top:24px">top 15% — status bar. Text OK, keep it clear of the very top.</div>

  <div class="g safe"></div>
  <div class="g subject">ZIP · mid-hiccup<br>eyes at maximum bulge<br>≈ 65% of frame height<br><br>cover frame = 0:11</div>
  <div class="g arc"></div>
  <div class="g lbl" style="left:640px; top:1040px">water arc — the big readable shape</div>

  <div class="title">HIC!</div>

  <div class="g band bottom"></div>
  <div class="g lbl" style="left:24px; bottom:400px">bottom 25% — title, channel name, action rail. Nothing important here.</div>

<script>
  const p = new URLSearchParams(location.search);
  document.body.className = p.get('mode') === 'overlay' ? 'overlay' : 'guide';
  const bg = p.get('bg');
  if (bg) document.getElementById('bg').style.backgroundImage = 'url("' + bg + '")';
</script>
</body>
</html>
