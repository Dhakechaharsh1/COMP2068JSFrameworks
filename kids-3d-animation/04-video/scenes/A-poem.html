<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>A — Five Sleepy Fireflies</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; }
  svg { display:block; }
  #lyric {
    font-family: "Baloo 2","Nunito","DejaVu Sans",sans-serif;
    font-weight: 700; font-size: 62px; fill: #FFF6E0;
    text-anchor: middle; letter-spacing: 1px;
  }
  #title {
    font-family: "Baloo 2","Nunito","DejaVu Sans",sans-serif;
    font-weight: 800; font-size: 92px; fill: #FFF6E0;
    text-anchor: middle; letter-spacing: 2px;
  }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop id="skyTop" offset="0%"   stop-color="#2B2350"/>
      <stop id="skyMid" offset="55%"  stop-color="#6E4A5C"/>
      <stop id="skyLow" offset="100%" stop-color="#D89A72"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%"   stop-color="#FFE9A8" stop-opacity="1"/>
      <stop offset="22%"  stop-color="#FFC65C" stop-opacity=".85"/>
      <stop offset="55%"  stop-color="#FF9E3D" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#FF8A1E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonhalo">
      <stop offset="0%"   stop-color="#FFF0C4" stop-opacity=".55"/>
      <stop offset="45%"  stop-color="#FFE2A0" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#FFD98C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig">
      <stop offset="55%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <!-- wool fuzz: a soft speckle that keeps the flats from looking like vector -->
    <filter id="fuzz" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.16" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="overlay"/>
    </filter>
    <mask id="crescent">
      <circle cx="0" cy="0" r="210" fill="#fff"/>
      <circle cx="118" cy="-58" r="180" fill="#000"/>
    </mask>
  </defs>

  <rect id="bg" x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>

  <!-- stars -->
  <g id="stars" opacity="0"></g>

  <!-- Nana Moon — crescent built with a mask; an arc-pair crescent silently
       collapses when the two radii resolve to the same value -->
  <g id="moon" opacity="0">
    <circle cx="0" cy="0" r="470" fill="url(#moonhalo)"/>
    <circle cx="0" cy="0" r="210" fill="#F6DFA0" mask="url(#crescent)"/>
    <g transform="translate(-56,26)">
      <path d="M-58,-20 q20,-24 40,0" fill="none" stroke="#C8A85E" stroke-width="9" stroke-linecap="round"/>
      <path d="M18,-20 q20,-24 40,0"  fill="none" stroke="#C8A85E" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="-58" cy="30" rx="24" ry="14" fill="#E8A9A0" opacity=".5"/>
      <ellipse cx="56"  cy="30" rx="24" ry="14" fill="#E8A9A0" opacity=".5"/>
      <path id="moonMouth" d="M-18,34 q18,15 36,0" fill="none" stroke="#C8A85E" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ================= HILLS ================= -->
  <g filter="url(#fuzz)">
    <path id="hill3" d="M0,760 q300,-120 620,-40 q340,86 700,-30 q340,-110 600,26 V1080 H0 Z" fill="#6B6E86"/>
    <path id="hill2" d="M0,860 q380,-150 780,-46 q360,94 640,-40 q280,-100 500,40 V1080 H0 Z" fill="#4E5570"/>

    <!-- toadstool houses on the middle hill -->
    <g id="houses">
      <g transform="translate(300,880)">
        <rect x="-56" y="-96" width="112" height="100" rx="26" fill="#3A4059"/>
        <path d="M-104,-88 a104,74 0 0 1 208,0 z" fill="#7A5468"/>
        <circle id="w1" cx="0" cy="-46" r="22" fill="#FFC96B"/>
      </g>
      <g transform="translate(1560,900)">
        <rect x="-50" y="-88" width="100" height="92" rx="24" fill="#3A4059"/>
        <path d="M-94,-80 a94,68 0 0 1 188,0 z" fill="#6E4E63"/>
        <circle id="w2" cx="0" cy="-42" r="20" fill="#FFC96B"/>
      </g>
      <g transform="translate(1170,930)">
        <rect x="-42" y="-76" width="84" height="80" rx="20" fill="#343A52"/>
        <path d="M-80,-70 a80,58 0 0 1 160,0 z" fill="#63465C"/>
        <circle id="w3" cx="0" cy="-36" r="17" fill="#FFC96B"/>
      </g>
    </g>

    <!-- the Trickle -->
    <path id="stream" d="M0,872 q300,-34 620,-6 q340,30 700,-12 q340,-36 600,10 v56 q-260,-46 -600,-10 q-360,42 -700,12 q-320,-28 -620,6 z" fill="#8FA3B8" opacity=".55"/>

    <path id="hill1" d="M0,980 q420,-120 860,-30 q380,80 620,-24 q220,-60 440,30 V1080 H0 Z" fill="#333A55"/>

    <!-- oversized clover in the foreground -->
    <g id="clover" fill="#272C44">
      <ellipse cx="120"  cy="1046" rx="86" ry="46"/>
      <ellipse cx="245"  cy="1058" rx="70" ry="38"/>
      <ellipse cx="1720" cy="1050" rx="94" ry="50"/>
      <ellipse cx="1840" cy="1062" rx="72" ry="40"/>
    </g>
  </g>

  <!-- ================= MOMO (seated on his doorstep) ================= -->
  <g id="momo" transform="translate(1548,846) scale(0.78)">
    <ellipse cx="0" cy="150" rx="150" ry="26" fill="#000" opacity=".22"/>
    <!-- ears -->
    <ellipse id="earL" cx="-72" cy="-186" rx="34" ry="62" fill="#C9A860"/>
    <ellipse cx="-72" cy="-186" rx="17" ry="36" fill="#E4CE95"/>
    <ellipse id="earR" cx="72"  cy="-186" rx="34" ry="62" fill="#C9A860"/>
    <ellipse cx="72"  cy="-186" rx="17" ry="36" fill="#E4CE95"/>
    <!-- body -->
    <ellipse cx="0" cy="62"  rx="94" ry="88" fill="#D4B36B"/>
    <ellipse cx="0" cy="-84" rx="102" ry="96" fill="#C9A860"/>
    <!-- star + overalls -->
    <path d="M0,-52 L15,-16 L54,-16 L23,8 L35,45 L0,22 L-35,45 L-23,8 L-54,-16 L-15,-16 Z"
          fill="#EFE6D2" opacity=".9" transform="translate(0,34) scale(.44)"/>
    <path d="M-80,74 h160 v40 a80,80 0 0 1 -160,0 z" fill="#2E6E72"/>
    <rect x="26" y="8" width="20" height="70" rx="9" fill="#2E6E72"/>
    <rect x="-50" y="26" width="20" height="52" rx="9" fill="#2E6E72" transform="rotate(-28 -40 52)"/>
    <!-- face -->
    <g id="momoEyes">
      <ellipse cx="-40" cy="-100" rx="25" ry="28" fill="#F3ECDC"/>
      <ellipse cx="40"  cy="-100" rx="25" ry="28" fill="#F3ECDC"/>
      <circle cx="-37" cy="-97" r="12" fill="#3A2A14"/>
      <circle cx="43"  cy="-97" r="12" fill="#3A2A14"/>
      <circle cx="-43" cy="-105" r="5" fill="#fff"/>
      <circle cx="37"  cy="-105" r="5" fill="#fff"/>
    </g>
    <g id="momoLids" opacity="0">
      <path d="M-65,-100 q25,18 50,0" fill="none" stroke="#8A7440" stroke-width="9" stroke-linecap="round"/>
      <path d="M15,-100 q25,18 50,0"  fill="none" stroke="#8A7440" stroke-width="9" stroke-linecap="round"/>
    </g>
    <ellipse cx="0" cy="-60" rx="11" ry="8" fill="#4A3A1C"/>
    <path id="momoMouth" d="M-14,-34 q14,10 28,0" fill="none" stroke="#6B4A28" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- ================= FIREFLIES ================= -->
  <g id="flies"></g>

  <!-- resting places: daisy, lily pad, leaf -->
  <g id="props" opacity="0"></g>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#vig)"/>

  <text id="title" x="960" y="540" opacity="0">Five Sleepy Fireflies</text>
  <text id="lyric" x="960" y="1000" opacity="0"></text>
</svg>

<script>
/* ============================================================================
   "Five Sleepy Fireflies" — 2:35, 1920x1080, Plush Hollow style.

   One continuous dusk-to-night scene rather than 20 hard cuts: on a bedtime
   video every cut is a small adrenaline hit, so the whole film is a single
   slow push with the firefly count falling 5 -> 1 on the verse beats.

   Deterministic — every property is a pure function of t. See render-video.js.
   ========================================================================= */

const DURATION = 155;             // 2:35
const $ = id => document.getElementById(id);

const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,u) => a+(b-a)*u;
const seg   = (t,t0,t1) => clamp((t-t0)/(t1-t0), 0, 1);
const easeOut  = u => 1-Math.pow(1-u,3);
const easeBoth = u => u<.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;
const pulse = u => Math.sin(Math.PI*clamp(u,0,1));

/* colour helpers — the sky is graded as one continuous sunset */
const hex = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
const mix = (a,b,u) => {
  const A = hex(a), Bc = hex(b);
  const r = Math.round(lerp(A[0],Bc[0],u)), g = Math.round(lerp(A[1],Bc[1],u)), bl = Math.round(lerp(A[2],Bc[2],u));
  return `rgb(${r},${g},${bl})`;
};

/* ---------- fireflies ----------
   Each one drifts on its own slow lissajous, then settles into a resting place
   at its beat. Nothing ever goes out — they dim and are hidden, because a
   two-year-old reads "extinguished" as loss. */
const FLIES = [
  { x0: 620,  y0: 470, ax: 130, ay: 74, fx: 0.055, fy: 0.083, ph: 0.0,
    settle: 41,  rest: [430, 812],  hideTo: 0.30 },   // into the daisy cup
  { x0: 880,  y0: 400, ax: 165, ay: 60, fx: 0.043, fy: 0.071, ph: 1.7,
    settle: 65,  rest: [760, 905],  hideTo: 0.42 },   // onto the lily pad
  { x0: 1120, y0: 445, ax: 120, ay: 88, fx: 0.061, fy: 0.052, ph: 3.1,
    settle: 89,  rest: [1105, 800], hideTo: 0.34 },   // under the leaf
  { x0: 1330, y0: 385, ax: 145, ay: 66, fx: 0.038, fy: 0.094, ph: 4.6,
    settle: 105, rest: [1604, 701], hideTo: 0.85 },   // onto Momo's ear
  { x0: 980,  y0: 520, ax: 190, ay: 96, fx: 0.049, fy: 0.063, ph: 5.9,
    settle: 999, rest: [0,0],       hideTo: 1 },      // the last one — rises
];

/* build the firefly nodes once */
(function buildFlies(){
  const g = $('flies');
  g.innerHTML = FLIES.map((_,i) =>
    `<g id="fly${i}"><circle r="78" fill="url(#glow)"/><circle r="11" fill="#FFF3CC"/></g>`
  ).join('');
})();

/* resting places, drawn only once their firefly needs them */
(function buildProps(){
  $('props').innerHTML = `
    <g id="daisy" opacity="0" transform="translate(430,812)">
      ${[0,45,90,135,180,225,270,315].map(a =>
        `<ellipse cx="0" cy="-40" rx="17" ry="38" fill="#EFE6D2" opacity=".92" transform="rotate(${a})"/>`).join('')}
      <circle r="21" fill="#E8C46A"/>
    </g>
    <g id="lily" opacity="0" transform="translate(760,905)">
      <ellipse rx="88" ry="30" fill="#3E6B58"/>
      <ellipse rx="88" ry="30" fill="#4E8069" transform="translate(0,-7)"/>
    </g>
    <g id="leaf" opacity="0" transform="translate(1105,800)">
      <path d="M0,-58 q92,44 0,104 q-92,-60 0,-104 z" fill="#3F6B54"/>
    </g>`;
})();

/* ---------- stars ---------- */
(function buildStars(){
  let s = '';
  for (let i = 0; i < 70; i++) {
    // deterministic scatter
    const n1 = Math.sin(i*127.1)*43758.5453, n2 = Math.sin(i*311.7)*24634.6345, n3 = Math.sin(i*74.7)*9812.113;
    const x = (n1 - Math.floor(n1)) * 1920;
    const y = (n2 - Math.floor(n2)) * 620;
    const r = 1.4 + (n3 - Math.floor(n3)) * 2.6;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#FFF6E0" opacity="${(0.4+(n3-Math.floor(n3))*0.6).toFixed(2)}"/>`;
  }
  $('stars').innerHTML = s;
})();

/* ---------- lyrics ---------- */
const CUES = [
  [8,  'Hush, hush, Puddleberry.'], [14, 'The lanterns are low.'], [20, ''],
  [24, 'Five sleepy fireflies,'],   [28, 'Blinking in the blue.'],
  [32, 'One found a daisy cup'],    [36, 'And curled up in the dew.'],
  [41, 'Blink, blink, little light,'], [45, 'Blink, blink, goodnight.'],
  [49, 'Blink, blink, little light,'], [53, 'Sleep till morning bright.'],
  [57, 'Four sleepy fireflies,'],   [61, 'Drifting past the stream.'],
  [65, 'One rode a lily pad'],      [69, 'And floated into dream.'],
  [73, 'Blink, blink, little light,'], [77, 'Blink, blink, goodnight.'],
  [81, 'Blink, blink, little light,'], [85, 'Sleep till morning bright.'],
  [89, 'Three sleepy fireflies,'],  [93, 'Wobbling round the tree.'],
  [97, 'One hid beneath a leaf,'],  [101,'As quiet as can be.'],
  [105,'Two sleepy fireflies,'],    [109,'Yawning in the air.'],
  [113,"One landed on Momo's ear"], [117,'And fell asleep right there.'],
  [121,'Blink, blink, little light,'], [125,'Blink, blink, goodnight.'],
  [129,'One sleepy firefly,'],      [133,'The very last to glow.'],
  [137,'She looked up at the moon'],[141,'And whispered, soft and low...'],
  [146,'Goodnight, goodnight.'],    [151,''],
];

function currentCue(t){
  let cue = ['', 0];
  for (let i = 0; i < CUES.length; i++) {
    if (t >= CUES[i][0]) cue = [CUES[i][1], CUES[i][0]];
  }
  return cue;
}

/* ---------- the scene ---------- */
function setTime(t){
  t = clamp(t, 0, DURATION);

  /* ---- sky: one continuous sunset, golden dusk -> deep indigo ---- */
  const night = easeBoth(seg(t, 6, 130));
  $('skyTop').setAttribute('stop-color', mix('#3A2F63', '#0B0A22', night));
  $('skyMid').setAttribute('stop-color', mix('#7E5566', '#191635', night));
  $('skyLow').setAttribute('stop-color', mix('#E5A878', '#2E2547', night));
  $('stars').setAttribute('opacity', seg(t, 40, 120) * 0.9);

  /* hills darken with the sky */
  $('hill3').setAttribute('fill',  mix('#7E819A', '#2A2E46', night));
  $('hill2').setAttribute('fill',  mix('#5A6280', '#1E2338', night));
  $('hill1').setAttribute('fill',  mix('#3C4463', '#141829', night));
  $('clover').setAttribute('fill', mix('#2F3550', '#0D101D', night));
  $('stream').setAttribute('fill',  mix('#A9BCCE', '#3C4A63', night));

  /* window lanterns flicker, then all but one go out near the end */
  const lastLantern = 1 - seg(t, 140, 152);
  [['w1',1.7],['w2',2.3],['w3',3.1]].forEach(([id, sp], i) => {
    const flick = 0.86 + 0.14*Math.sin(t*sp);
    const on = i === 0 ? 1 : lastLantern;
    $(id).setAttribute('opacity', (flick * on).toFixed(3));
  });

  /* ---- camera: one very slow push in across the whole film ---- */
  const push = 1 + easeBoth(seg(t, 0, DURATION)) * 0.09;
  $('stage').setAttribute('viewBox',
    `${(960*(1-1/push)).toFixed(1)} ${(540*(1-1/push)*0.7).toFixed(1)} ${(1920/push).toFixed(1)} ${(1080/push).toFixed(1)}`);

  /* ---- resting places fade in just before they're needed ---- */
  $('props').setAttribute('opacity', 1);
  $('daisy').setAttribute('opacity', seg(t, 30, 38));
  $('lily').setAttribute('opacity',  seg(t, 54, 62));
  $('leaf').setAttribute('opacity',  seg(t, 78, 86));

  /* the daisy closes over firefly 1 */
  const close = seg(t, 43, 50);
  $('daisy').setAttribute('transform', `translate(430,812) scale(${lerp(1,0.55,close)},${lerp(1,0.7,close)})`);

  /* the lily pad drifts left to right — the Trickle always flows that way */
  $('lily').setAttribute('transform', `translate(${(760 + Math.sin(t*0.06)*90).toFixed(1)},905)`);

  /* ---- fireflies ---- */
  FLIES.forEach((f, i) => {
    const el = $('fly' + i);
    let x = f.x0 + Math.sin(t*f.fx*2*Math.PI + f.ph) * f.ax;
    let y = f.y0 + Math.sin(t*f.fy*2*Math.PI + f.ph*1.7) * f.ay;
    let scale = 1, op = 1;

    if (i === 4) {
      // the last firefly: rises alone to the moon, then stays as a tiny light
      const rise = seg(t, 129, 143);
      y = lerp(y, 560, easeOut(rise));
      x = lerp(x, 1210, easeOut(rise));
      scale = lerp(1, 0.5, rise);
    } else {
      const s = seg(t, f.settle - 4, f.settle + 3);
      if (s > 0) {
        x = lerp(x, f.rest[0], easeOut(s));
        y = lerp(y, f.rest[1], easeOut(s));
        // dimmed and tucked away — never extinguished
        scale = lerp(1, 0.62, s);
        op = lerp(1, 1 - f.hideTo, s);
      }
    }

    // every firefly breathes; settled ones breathe slower
    const settled = t > f.settle;
    const breath = 0.82 + 0.18*Math.sin(t*(settled ? 1.1 : 2.4) + i*1.3);
    el.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${(scale*breath).toFixed(3)})`);
    el.setAttribute('opacity', (op * (0.55 + 0.45*breath)).toFixed(3));
  });

  /* ---- Momo ---- */
  // he watches the fireflies, then his eyes close for good around the last chorus
  const sleep = seg(t, 118, 133);
  $('momoLids').setAttribute('opacity', sleep);
  $('momoEyes').setAttribute('opacity', 1 - sleep);
  $('momoMouth').setAttribute('d', sleep > 0.5 ? 'M-12,-34 q12,7 24,0' : 'M-14,-34 q14,10 28,0');
  // the ear twitches once when firefly 4 lands on it, then stills
  const twitch = pulse(seg(t, 105, 106.6));
  $('earR').setAttribute('transform', `rotate(${(twitch*13).toFixed(2)} 72 -140)`);
  // gentle breathing
  const br = 1 + Math.sin(t*0.9)*0.012;
  $('momo').setAttribute('transform', `translate(1548,846) scale(${(0.78*br).toFixed(4)},${(0.78/br).toFixed(4)})`);

  /* ---- Nana Moon ---- */
  const rise = easeOut(seg(t, 122, 142));
  $('moon').setAttribute('opacity', seg(t, 120, 132));
  $('moon').setAttribute('transform',
    `translate(${lerp(1080, 1020, rise).toFixed(1)},${lerp(1180, 268, rise).toFixed(1)})`);
  // she hums — the mouth moves very slightly
  const hum = 26 + Math.sin(t*1.6)*4;
  $('moonMouth').setAttribute('d', `M-14,${hum.toFixed(1)} q14,12 28,0`);

  /* ---- title ---- */
  $('title').setAttribute('opacity', (pulse(seg(t, 1, 7)) * 1.1).toFixed(3));

  /* ---- lyrics ---- */
  const [text, at] = currentCue(t);
  const ly = $('lyric');
  ly.textContent = text;
  // fade in fast, hold, fade out before the next line
  const inU  = seg(t, at, at + 0.6);
  const outU = 1 - seg(t, at + 3.2, at + 3.9);
  ly.setAttribute('opacity', text ? (Math.min(inU, outU) * 0.94).toFixed(3) : 0);
}

window.setTime = setTime;
window.DURATION = DURATION;
setTime(0);
</script>
</body>
</html>
